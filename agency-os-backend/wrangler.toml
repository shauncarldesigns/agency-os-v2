name = "agency-os-v2-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[routes]]
pattern = "try.shauncarldesigns.com"
custom_domain = true

[[routes]]
pattern = "api.shauncarldesigns.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "agency-os-v2"
database_id = "dfe72eea-8a18-47ce-a806-2cbd13139c04"

[[r2_buckets]]
binding = "RECORDINGS"
bucket_name = "agency-os-recordings"

[[ratelimits]]
name = "CLICK_RATE_LIMITER"
namespace_id = "19601"

  [ratelimits.simple]
  limit = 120
  period = 60

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = [
  "0 6 * * *",     # Daily 6am — refresh PageSpeed for live Tier 3 sites
  "0 8 * * 1",    # Weekly Monday 8am — intermediate GSC refresh
  "0 * * * *",    # Hourly — DNS poll for projects still awaiting NS delegation
  "15 */4 * * *", # Every 4 hours — Clarity export sync (6/day; API quota is 10/day)
  "*/5 * * * *"   # Every 5 minutes — process due email outreach automations
]

[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[vars]
ENV = "production"
CLARITY_PROJECT_ID = "xt0tg8n14n"
# Market research — MCC id (10 digits, no dashes) + volume provider switch.
# NOTE: the monthly research refresh has NO cron entry here — the Worker is
# at Cloudflare's five-trigger limit, so it rides the hourly trigger with a
# "1st of month, 9am America/Chicago" guard in src/index.ts.
GOOGLE_ADS_LOGIN_CUSTOMER_ID = "1493697645"
KEYWORD_VOLUME_PROVIDER = "google_ads"
OUTREACH_EMAIL_FROM = "Shaun Gehrke <info@shauncarldesigns.com>"
OUTREACH_EMAIL_REPLY_TO = "info@shauncarldesigns.com"
OUTREACH_PUBLIC_URL = "https://try.shauncarldesigns.com"
AUTH_MODE = "access"
ACCESS_TEAM_DOMAIN = "https://tight-disk-cf65.cloudflareaccess.com"
ACCESS_AUD = "7eeaead9db443c98d907f4b64f34997a6cf1c6065591640b3f8a0e0e7159c388"
ACCESS_ALLOWED_EMAIL = "info@shauncarldesigns.com"
DASHBOARD_ORIGIN = "https://app.shauncarldesigns.com"

# Secrets (set via `npx wrangler secret put`):
# CLAUDE_API_KEY
# GOOGLE_PLACES_API_KEY
# GOOGLE_OAUTH_CLIENT_ID
# GOOGLE_OAUTH_CLIENT_SECRET
# GOOGLE_OAUTH_REFRESH_TOKEN
# CLOUDFLARE_API_TOKEN
# CLOUDFLARE_ACCOUNT_ID
# RESEND_API_KEY
# RESEND_WEBHOOK_SECRET
# OUTSCRAPER_API_KEY  (optional — fetches up to 50 Google reviews per lead;
#                     without it, enrichment falls back to Google's 5)
# TWILIO_ACCOUNT_SID  (optional — enables phone route classification)
# TWILIO_AUTH_TOKEN   (optional — enables phone route classification)
# TWILIO_MESSAGING_SERVICE_SID (required for Messaging Employee live transport)
# TWILIO_PHONE_NUMBER (dedicated display/sender number attached to the service)
# TEST_SMS_NUMBER_1 / TEST_SMS_NUMBER_2 (approved live-test recipients only)
# TWILIO_A2P_REGISTERED (set to literal "true" only after external registration)
# CLARITY_API_TOKEN   (optional — enables Clarity engagement sync)
# GOOGLE_ADS_DEVELOPER_TOKEN  (market research keyword volume. Issued 2026-08-06
#                              at EXPLORER access, which BLOCKS KeywordPlanIdeaService
#                              outright — calls are refused, not degraded. Basic
#                              Access is a hard prerequisite, not a data-quality
#                              upgrade. Treat "Explorer" as not-configured in the
#                              health card. Basic Access applied for via
#                              ads.google.com/aw/apicenter -> Apply for Basic Access.)
# GOOGLE_ADS_REFRESH_TOKEN    (must include the .../auth/adwords scope; the
#                              OAuth client id/secret fall back to the shared
#                              GOOGLE_OAUTH_* Search Console pair — set
#                              GOOGLE_ADS_CLIENT_ID / GOOGLE_ADS_CLIENT_SECRET
#                              only to override with a dedicated client)
# BUILDER_API_TOKEN           (random bearer token used only by the local
#                              Playwright Builder Employee)
